<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Web Assistant</title>
  <style>
    :root {
      --bg-dark: #202123;
      --chat-dark: #343541;
      --sidebar-dark: #202123;
      --text-main: #ececf1;
      --border-color: #4d4d4f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 280px; background-color: var(--sidebar-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 14px; gap: 12px; }
    .sidebar h2 { font-size: 16px; margin-bottom: 8px; color: #fff; }
    .sidebar label { font-size: 12px; color: #9ca3af; }
    .sidebar input { background: #40414f; border: 1px solid #565869; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; }
    .sidebar input:focus { border-color: #10a37f; }
    .status-text { font-size: 12px; color: #10a37f; min-height: 16px; }

    /* Chat Area */
    .main-chat { flex: 1; display: flex; flex-direction: column; background-color: var(--chat-dark); position: relative; }
    .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    
    .row { display: flex; justify-content: center; width: 100%; border-bottom: 1px solid rgba(0,0,0,0.1); padding: 20px 0; }
    .row.model { background-color: #444654; }
    .bubble { width: 100%; max-width: 760px; padding: 0 20px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .bubble b { display: block; margin-bottom: 6px; font-size: 13px; color: #9ca3af; text-transform: uppercase; }

    /* Input Dock */
    .input-dock { width: 100%; display: flex; justify-content: center; padding: 20px; background: linear-gradient(180deg, rgba(53,53,65,0) 0%, #343541 50%); }
    .input-box-wrapper { width: 100%; max-width: 760px; background-color: #40414f; border: 1px solid rgba(32,33,35,0.5); border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; align-items: center; padding: 6px 14px; }
    .input-box-wrapper textarea { flex: 1; background: transparent; border: none; color: #fff; resize: none; font-size: 15px; outline: none; height: 24px; max-height: 200px; }
    .send-btn { background: #19c37d; border: none; border-radius: 6px; color: white; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .send-btn:disabled { background: #565869; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Controls Sidebar -->
  <div class="sidebar">
    <h2>Configuration</h2>
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." />
    <span class="status-text" id="keyStatus"></span>

    <label for="urlInput">Target Knowledge URL:</label>
    <input type="url" id="urlInput" placeholder="https://example.com/article" />
    <span class="status-text" id="urlStatus"></span>
  </div>

  <!-- Chat View -->
  <div class="main-chat">
    <div class="chat-history" id="chatBox">
      <div class="row model">
        <div class="bubble">
          <b>Assistant</b>
          Welcome! Add your Gemini API key in the sidebar. You can also paste a URL to ground the conversation in that webpage's content.
        </div>
      </div>
    </div>

    <div class="input-dock">
      <div class="input-box-wrapper">
        <textarea id="promptInput" rows="1" placeholder="Send a message..."></textarea>
        <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById("apiKey");
    const keyStatus = document.getElementById("keyStatus");
    const urlInput = document.getElementById("urlInput");
    const urlStatus = document.getElementById("urlStatus");
    const chatBox = document.getElementById("chatBox");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];
    let cachedUrl = "";
    let extractedText = "";

    // Load saved API key from localStorage
    if (localStorage.getItem("gemini_key")) {
      apiKeyInput.value = localStorage.getItem("gemini_key");
      keyStatus.textContent = "Key loaded";
    }

    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("gemini_key", apiKeyInput.value.trim());
      keyStatus.textContent = apiKeyInput.value.trim() ? "Key saved" : "";
    });

    async function fetchWebpageContent(url) {
      if (!url) return "";
      if (url === cachedUrl && extractedText) return extractedText;

      urlStatus.textContent = "Fetching content...";
      try {
        // Uses AllOrigins CORS proxy to scrape client-side
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, "text/html");

        // Remove non-content tags
        ["script", "style", "nav", "footer", "header", "svg"].forEach(t => {
          doc.querySelectorAll(t).forEach(el => el.remove());
        });

        cachedUrl = url;
        extractedText = (doc.body.innerText || "").replace(/\s+/g, " ").trim().slice(0, 35000);
        urlStatus.textContent = "Loaded (" + extractedText.length + " chars)";
        return extractedText;
      } catch (err) {
        urlStatus.textContent = "Failed to load URL";
        return "";
      }
    }

    function appendMessage(role, text) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      row.innerHTML = `<div class="bubble"><b>${role === 'user' ? 'You' : 'Assistant'}</b>${text}</div>`;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return row.querySelector(".bubble");
    }

    async function sendMessage() {
      const prompt = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) {
        alert("Please enter your Gemini API key in the sidebar.");
        return;
      }
      if (!prompt) return;

      appendMessage("user", prompt);
      promptInput.value = "";
      sendBtn.disabled = true;

      const pageText = await fetchWebpageContent(urlInput.value.trim());

      history.push({ role: "user", parts: [{ text: prompt }] });

      const assistantBubble = appendMessage("model", "Thinking...");

      try {
        // Direct call to Gemini 2.5 Flash via REST endpoint
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        let systemInstruction = "You are a helpful AI assistant modeled after ChatGPT.";
        if (pageText) {
          systemInstruction += `\nGround your answers in this webpage context:\n${pageText}`;
        }

        const payload = {
          contents: history,
          systemInstruction: {
            parts: [{ text: systemInstruction }]
          }
        };

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
        assistantBubble.innerHTML = `<b>Assistant</b>${reply}`;
        history.push({ role: "model", parts: [{ text: reply }] });
      } catch (err) {
        assistantBubble.innerHTML = `<b>Assistant</b><span style="color:#ef4444;">Error: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
