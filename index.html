<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Assistant</title>
  
  <!-- Inter & Roboto Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown Parser, Code Syntax Highlighting & Math (KaTeX) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-primary: #131314;
      --bg-surface: #1e1f20;
      --bg-surface-elevated: #282a2c;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --accent-blue: #a8c7fa;
      --user-bubble: #282a2c;
      --border-color: #36373a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* Collapsible Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 16px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-color);
      transition: margin-left 0.25s ease;
      z-index: 10;
    }
    .sidebar.closed { margin-left: -280px; }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      color: var(--text-main);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .new-chat-btn:hover { background-color: #37393b; }

    .sidebar-config {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .sidebar-config input {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .sidebar-config input:focus { border-color: var(--accent-blue); }

    .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .chat-list-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); padding: 8px 6px; }
    .chat-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item:hover { background-color: var(--bg-surface-elevated); }

    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background-color: var(--bg-primary);
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .top-bar-title {
      font-size: 18px;
      font-weight: 500;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 50%;
    }
    .icon-btn:hover { background: var(--bg-surface-elevated); color: var(--text-main); }

    /* Chat Messages Box */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-greeting {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      max-width: 600px;
    }
    .hero-greeting h1 {
      font-size: 38px;
      font-weight: 500;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-greeting p { color: var(--text-muted); font-size: 16px; }

    .message-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .message { display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.68; }

    /* User Message */
    .message.user {
      align-self: flex-end;
      background-color: var(--user-bubble);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 20px;
      max-width: 80%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Model Message */
    .message.model {
      align-self: flex-start;
      width: 100%;
      word-break: break-word;
    }
    .message.model .role-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-blue);
      margin-bottom: 4px;
    }
    .message.model .content { color: var(--text-main); }

    /* Markdown Styling */
    .content p { margin-bottom: 12px; }
    .content p:last-child { margin-bottom: 0; }
    .content ul, .content ol { margin-left: 24px; margin-bottom: 12px; }
    .content li { margin-bottom: 4px; }
    .content table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: 14px; }
    .content th, .content td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }
    .content th { background: var(--bg-surface-elevated); }
    .content code { font-family: 'Roboto Mono', monospace; font-size: 13px; background: #282a2c; padding: 2px 6px; border-radius: 4px; }

    /* Code Blocks with Copy Button */
    .code-block-wrapper {
      position: relative;
      margin: 14px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #18181b;
      border: 1px solid var(--border-color);
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #242427;
      padding: 6px 12px;
      font-size: 12px;
      color: #a1a1aa;
      font-family: 'Roboto Mono', monospace;
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 12px;
    }
    .copy-btn:hover { color: #fff; }
    .code-block-wrapper pre { margin: 0; padding: 14px; overflow-x: auto; }
    .code-block-wrapper pre code { background: transparent; padding: 0; font-size: 13px; }

    /* Bottom Input Composer */
    .composer-dock {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 20px;
    }
    .composer-box {
      width: 100%;
      max-width: 820px;
      background-color: var(--bg-surface);
      border-radius: 28px;
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .composer-box:focus-within { border-color: #555; }
    .composer-row { display: flex; align-items: flex-end; gap: 12px; }
    .composer-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      resize: none;
      height: 24px;
      max-height: 220px;
      line-height: 1.5;
    }
    .send-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--text-main);
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-circle-btn:disabled { background: #37393b; color: #666; cursor: not-allowed; }

    .disclaimer { font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New chat
    </button>

    <div class="sidebar-config">
      <label>Gemini API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <span id="apiKeyStatus" style="color: #a8c7fa; font-size: 11px;"></span>
    </div>

    <div class="sidebar-config">
      <label>Model</label>
      <input type="text" id="modelInput" value="gemini-2.5-flash" />
    </div>

    <div class="chat-list-title">Recent Chats</div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- Main View -->
  <main class="main">
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <span class="top-bar-title">Gemini</span>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="hero-greeting" id="heroGreeting">
        <h1>Hello</h1>
        <p>How can I help you today?</p>
      </div>

      <div class="message-container" id="messageContainer"></div>
    </div>

    <!-- Input Dock -->
    <div class="composer-dock">
      <div class="composer-box">
        <div class="composer-row">
          <textarea id="promptInput" rows="1" placeholder="Ask Gemini..."></textarea>
          <button class="send-circle-btn" id="sendBtn" onclick="handleSend()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">Gemini may display inaccurate info, so double-check its responses.</div>
    </div>
  </main>

  <script>
    const sidebar = document.getElementById("sidebar");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const apiKeyStatus = document.getElementById("apiKeyStatus");
    const modelInput = document.getElementById("modelInput");
    const chatScroll = document.getElementById("chatScroll");
    const heroGreeting = document.getElementById("heroGreeting");
    const messageContainer = document.getElementById("messageContainer");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatList = document.getElementById("chatList");

    let history = [];

    // Load saved API Key
    if (localStorage.getItem("user_gemini_key")) {
      apiKeyInput.value = localStorage.getItem("user_gemini_key");
      apiKeyStatus.textContent = "✓ Key saved in browser";
    }

    apiKeyInput.addEventListener("input", () => {
      const key = apiKeyInput.value.trim();
      localStorage.setItem("user_gemini_key", key);
      apiKeyStatus.textContent = key ? "✓ Key saved in browser" : "";
    });

    // Auto-grow textarea
    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 220) + "px";
    });

    function toggleSidebar() {
      sidebar.classList.toggle("closed");
    }

    function startNewChat() {
      history = [];
      messageContainer.innerHTML = "";
      heroGreeting.style.display = "flex";
      promptInput.value = "";
      promptInput.style.height = "24px";
    }

    function renderMarkdown(rawText, containerElement) {
      // Convert markdown
      containerElement.innerHTML = marked.parse(rawText);

      // Syntax highlight code blocks & add copy buttons
      containerElement.querySelectorAll("pre code").forEach((codeBlock) => {
        hljs.highlightElement(codeBlock);

        const pre = codeBlock.parentElement;
        if (!pre.parentElement.classList.contains("code-block-wrapper")) {
          const wrapper = document.createElement("div");
          wrapper.className = "code-block-wrapper";

          const header = document.createElement("div");
          header.className = "code-header";
          header.innerHTML = `<span>code</span><button class="copy-btn" onclick="copyCode(this)">Copy</button>`;

          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(header);
          wrapper.appendChild(pre);
        }
      });

      // Render math equations with KaTeX
      renderMathInElement(containerElement, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    function copyCode(btn) {
      const code = btn.closest(".code-block-wrapper").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy"; }, 2000);
    }

    function appendUserMessage(text) {
      heroGreeting.style.display = "none";
      const div = document.createElement("div");
      div.className = "message user";
      div.textContent = text;
      messageContainer.appendChild(div);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function createModelMessagePlaceholder() {
      const div = document.createElement("div");
      div.className = "message model";
      div.innerHTML = `
        <div class="role-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
          Gemini
        </div>
        <div class="content">...</div>
      `;
      messageContainer.appendChild(div);
      chatScroll.scrollTop = chatScroll.scrollHeight;
      return div.querySelector(".content");
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const model = modelInput.value.trim() || "gemini-2.5-flash";

      if (!apiKey) {
        alert("Please enter your Gemini API key in the sidebar.");
        return;
      }
      if (!text) return;

      appendUserMessage(text);
      promptInput.value = "";
      promptInput.style.height = "24px";
      sendBtn.disabled = true;

      history.push({ role: "user", parts: [{ text }] });
      const contentTarget = createModelMessagePlaceholder();

      // Add to sidebar chat list if first message
      if (history.length === 1) {
        const item = document.createElement("div");
        item.className = "chat-item";
        item.textContent = text.slice(0, 30) + (text.length > 30 ? "..." : "");
        chatList.prepend(item);
      }

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;

        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: history })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "Failed request");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              try {
                const json = JSON.parse(line.substring(6));
                const textChunk = json.candidates?.[0]?.content?.parts?.[0]?.text || "";
                fullReply += textChunk;
                renderMarkdown(fullReply, contentTarget);
                chatScroll.scrollTop = chatScroll.scrollHeight;
              } catch (e) {
                // ignore SSE parse glitches
              }
            }
          }
        }

        history.push({ role: "model", parts: [{ text: fullReply }] });
      } catch (err) {
        contentTarget.innerHTML = `<span style="color:#f87171;">Error: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }
    }

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
