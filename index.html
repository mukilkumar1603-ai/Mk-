<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SMK Chatbot</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown, Code Syntax Highlighting & Math Support -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-primary: #131314;
      --bg-surface: #1e1f20;
      --bg-surface-elevated: #282a2c;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --accent-blue: #a8c7fa;
      --user-bubble: #282a2c;
      --border-color: #36373a;
      --active-item: #333538;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100%;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
    }

    /* Backdrop overlay on tablet/mobile when sidebar is open */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    /* Responsive Slide Drawer Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 14px;
      border-right: 1px solid var(--border-color);
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }
    .sidebar.open {
      transform: translateX(0);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      color: var(--text-main);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .new-chat-btn:hover { background-color: #37393b; }

    .sidebar-config {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .sidebar-config input {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .sidebar-config input:focus { border-color: var(--accent-blue); }

    .chat-history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px 2px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }
    .clear-all-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
    }
    .clear-all-btn:hover { color: #f87171; }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-item-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px;
      padding: 2px 6px;
    }
    .chat-item-wrapper:hover { background-color: var(--bg-surface-elevated); }
    .chat-item-wrapper.active { background-color: var(--active-item); font-weight: 500; }
    
    .chat-item-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      text-align: left;
      padding: 8px 4px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .delete-chat-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .delete-chat-btn:hover { color: #f87171; }

    /* Main Workspace */
    .main {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-primary);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .top-bar-title {
      font-size: 17px;
      font-weight: 600;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
    }
    .icon-btn:hover { background: var(--bg-surface-elevated); color: var(--text-main); }

    .model-selector-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .model-select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 28px 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      max-width: 180px;
    }
    .model-selector-wrapper svg {
      position: absolute;
      right: 10px;
      pointer-events: none;
      color: var(--text-muted);
    }

    /* Scrollable Conversation Stream */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-greeting {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      max-width: 500px;
      padding: 0 16px;
    }
    .hero-greeting h1 {
      font-size: 32px;
      font-weight: 600;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-greeting p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }

    .message-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-bubble);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 18px;
      max-width: 85%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .attached-file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #36373a;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--accent-blue);
    }

    .message.model {
      align-self: flex-start;
      width: 100%;
      word-break: break-word;
    }
    .message.model .role-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-blue);
      margin-bottom: 4px;
    }
    .message.model .content { color: var(--text-main); }

    .response-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .action-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
    }

    /* Markdown Styling */
    .content p { margin-bottom: 10px; }
    .content p:last-child { margin-bottom: 0; }
    .content ul, .content ol { margin-left: 20px; margin-bottom: 10px; }
    .content li { margin-bottom: 4px; }
    .content table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
    .content th, .content td { border: 1px solid var(--border-color); padding: 6px 10px; text-align: left; }
    .content th { background: var(--bg-surface-elevated); }
    .content code { font-family: 'Roboto Mono', monospace; font-size: 12px; background: #282a2c; padding: 2px 4px; border-radius: 4px; }

    /* Code Blocks */
    .code-block-wrapper {
      position: relative;
      margin: 12px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #18181b;
      border: 1px solid var(--border-color);
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #242427;
      padding: 6px 12px;
      font-size: 11px;
      color: #a1a1aa;
      font-family: 'Roboto Mono', monospace;
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 11px;
    }
    .code-block-wrapper pre { margin: 0; padding: 12px; overflow-x: auto; }
    .code-block-wrapper pre code { background: transparent; padding: 0; font-size: 12px; }

    /* Composer Dock */
    .composer-dock {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      flex-shrink: 0;
      background-color: var(--bg-primary);
    }
    .composer-box {
      width: 100%;
      max-width: 800px;
      background-color: var(--bg-surface);
      border-radius: 24px;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    .composer-box:focus-within { border-color: #555; }

    .attachment-preview {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--text-main);
    }
    .attachment-preview.active { display: inline-flex; }
    .remove-file-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; }

    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    .composer-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      resize: none;
      height: 24px;
      max-height: 140px;
      line-height: 1.5;
    }
    .send-circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--text-main);
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-circle-btn:disabled { background: #37393b; color: #666; cursor: not-allowed; }

    .disclaimer { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }

    /* On large desktop screens, dock the sidebar side-by-side cleanly */
    @media (min-width: 1024px) {
      .sidebar {
        transform: translateX(0);
        position: relative;
      }
      .sidebar.closed {
        display: none;
      }
      .main {
        flex: 1;
        width: calc(100vw - 280px);
      }
      .sidebar-overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Drawer Backdrop for mobile/tablet -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- Left Sidebar Drawer -->
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New chat
    </button>

    <div class="sidebar-config">
      <label>Gemini API Key</label>
      <input type="password" id="apiKeyInput" placeholder="Paste your API key here" />
      <span id="apiKeyStatus" style="color: #a8c7fa; font-size: 11px;"></span>
    </div>

    <div class="chat-history-header">
      <span>Chat History</span>
      <button class="clear-all-btn" onclick="clearAllChats()" title="Clear all chats">Clear all</button>
    </div>
    
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- Main View -->
  <main class="main">
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="icon-btn" onclick="toggleSidebar()" title="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <span class="top-bar-title">SMK Chatbot</span>
      </div>

      <!-- Header Model Choice Option -->
      <div class="model-selector-wrapper">
        <select class="model-select" id="modelSelect">
          <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="hero-greeting" id="heroGreeting">
        <h1>SMK Chatbot</h1>
        <p>Ready to assist. Select your model above, attach files, or tap the menu to view history.</p>
      </div>

      <div class="message-container" id="messageContainer"></div>
    </div>

    <!-- Input Dock -->
    <div class="composer-dock">
      <div class="composer-box">
        <div class="attachment-preview" id="attachmentPreview">
          <span id="attachmentName">file.pdf</span>
          <button class="remove-file-btn" onclick="clearAttachedFile()">✕</button>
        </div>

        <div class="composer-row">
          <input type="file" id="fileUpload" style="display:none;" onchange="handleFileSelected(event)" />
          
          <button class="icon-btn" onclick="document.getElementById('fileUpload').click()" title="Attach file or image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>

          <textarea id="promptInput" rows="1" placeholder="Message SMK Chatbot..."></textarea>
          
          <button class="send-circle-btn" id="sendBtn" onclick="handleSend()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">SMK Chatbot can make mistakes. Verify important information.</div>
    </div>
  </main>

  <script>
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const apiKeyStatus = document.getElementById("apiKeyStatus");
    const modelSelect = document.getElementById("modelSelect");
    const chatScroll = document.getElementById("chatScroll");
    const heroGreeting = document.getElementById("heroGreeting");
    const messageContainer = document.getElementById("messageContainer");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatList = document.getElementById("chatList");
    const fileUpload = document.getElementById("fileUpload");
    const attachmentPreview = document.getElementById("attachmentPreview");
    const attachmentName = document.getElementById("attachmentName");

    let currentSessionId = null;
    let conversations = {};
    let currentAttachment = null;
    let rawReplies = {};

    function loadSavedState() {
      if (localStorage.getItem("smk_api_key")) {
        const savedKey = localStorage.getItem("smk_api_key");
        apiKeyInput.value = savedKey;
        refreshAvailableModels(savedKey);
      }
      if (localStorage.getItem("smk_selected_model")) {
        modelSelect.value = localStorage.getItem("smk_selected_model");
      }
      if (localStorage.getItem("smk_conversations")) {
        try {
          conversations = JSON.parse(localStorage.getItem("smk_conversations"));
        } catch (e) {
          conversations = {};
        }
      }
      renderChatSessions();
    }

    async function refreshAvailableModels(key) {
      if (!key) return;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await res.json();
        if (data.models && Array.isArray(data.models)) {
          const supported = data.models
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
            .map(m => m.name.replace("models/", ""));

          if (supported.length > 0) {
            const currentSelected = modelSelect.value;
            modelSelect.innerHTML = "";
            supported.forEach(m => {
              const opt = document.createElement("option");
              opt.value = m;
              opt.textContent = m;
              modelSelect.appendChild(opt);
            });
            if (supported.includes(currentSelected)) {
              modelSelect.value = currentSelected;
            } else {
              modelSelect.selectedIndex = 0;
            }
            apiKeyStatus.textContent = `✓ Key active (${supported.length} models)`;
          }
        }
      } catch (err) {}
    }

    apiKeyInput.addEventListener("input", () => {
      const key = apiKeyInput.value.trim();
      localStorage.setItem("smk_api_key", key);
      if (key) {
        refreshAvailableModels(key);
      } else {
        apiKeyStatus.textContent = "";
      }
    });

    modelSelect.addEventListener("change", () => {
      localStorage.setItem("smk_selected_model", modelSelect.value);
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + "px";
    });

    function toggleSidebar() {
      const isOpen = sidebar.classList.contains("open");
      if (isOpen) {
        closeSidebar();
      } else {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("active");
      }
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("active");
    }

    function startNewChat() {
      currentSessionId = "session_" + Date.now();
      conversations[currentSessionId] = { title: "New conversation", history: [] };
      clearAttachedFile();
      messageContainer.innerHTML = "";
      heroGreeting.style.display = "flex";
      promptInput.value = "";
      promptInput.style.height = "24px";
      renderChatSessions();
      closeSidebar();
    }

    function saveConversationsToStorage() {
      localStorage.setItem("smk_conversations", JSON.stringify(conversations));
    }

    function renderChatSessions() {
      chatList.innerHTML = "";
      const sessionIds = Object.keys(conversations).sort((a, b) => {
        const tA = parseInt(a.replace("session_", "")) || 0;
        const tB = parseInt(b.replace("session_", "")) || 0;
        return tB - tA;
      });

      sessionIds.forEach(id => {
        const item = document.createElement("div");
        item.className = `chat-item-wrapper ${id === currentSessionId ? "active" : ""}`;

        const btn = document.createElement("button");
        btn.className = "chat-item-btn";
        btn.textContent = conversations[id].title || "Chat";
        btn.onclick = () => {
          loadChatSession(id);
          closeSidebar();
        };

        const delBtn = document.createElement("button");
        delBtn.className = "delete-chat-btn";
        delBtn.innerHTML = "✕";
        delBtn.title = "Delete chat";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChatSession(id);
        };

        item.appendChild(btn);
        item.appendChild(delBtn);
        chatList.appendChild(item);
      });
    }

    function loadChatSession(id) {
      if (!conversations[id]) return;
      currentSessionId = id;
      renderChatSessions();

      const session = conversations[id];
      messageContainer.innerHTML = "";

      if (!session.history || session.history.length === 0) {
        heroGreeting.style.display = "flex";
        return;
      }

      heroGreeting.style.display = "none";
      session.history.forEach(item => {
        if (item.role === "user") {
          const userText = item.parts?.find(p => p.text)?.text || "";
          const hasFile = item.parts?.some(p => p.inlineData);
          appendUserMessage(userText, hasFile ? "Attachment" : null, false);
        } else if (item.role === "model") {
          const replyText = item.parts?.[0]?.text || "";
          const msgId = Date.now() + Math.random();
          const { content: c, actions: a } = createModelMessagePlaceholder(msgId);
          rawReplies[msgId] = replyText;
          renderMarkdown(replyText, c);
          populateActionButtons(a, msgId, "");
        }
      });
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function deleteChatSession(id) {
      delete conversations[id];
      saveConversationsToStorage();
      if (currentSessionId === id) {
        startNewChat();
      } else {
        renderChatSessions();
      }
    }

    function clearAllChats() {
      if (confirm("Delete all chat history?")) {
        conversations = {};
        saveConversationsToStorage();
        startNewChat();
      }
    }

    function handleFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Data = event.target.result.split(",")[1];
        currentAttachment = {
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          data: base64Data
        };
        attachmentName.textContent = file.name;
        attachmentPreview.classList.add("active");
      };
      reader.readAsDataURL(file);
    }

    function clearAttachedFile() {
      currentAttachment = null;
      fileUpload.value = "";
      attachmentPreview.classList.remove("active");
    }

    function renderMarkdown(rawText, containerElement) {
      containerElement.innerHTML = marked.parse(rawText);

      containerElement.querySelectorAll("pre code").forEach((codeBlock) => {
        hljs.highlightElement(codeBlock);
        const pre = codeBlock.parentElement;
        if (!pre.parentElement.classList.contains("code-block-wrapper")) {
          const wrapper = document.createElement("div");
          wrapper.className = "code-block-wrapper";
          const header = document.createElement("div");
          header.className = "code-header";
          header.innerHTML = `<span>code</span><button class="copy-btn" onclick="copyCode(this)">Copy</button>`;
          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(header);
          wrapper.appendChild(pre);
        }
      });

      renderMathInElement(containerElement, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    function copyCode(btn) {
      const code = btn.closest(".code-block-wrapper").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy"; }, 2000);
    }

    function copyReply(msgId, btn) {
      const text = rawReplies[msgId] || "";
      navigator.clipboard.writeText(text);
      const original = btn.innerHTML;
      btn.innerHTML = `✓ Copied`;
      setTimeout(() => { btn.innerHTML = original; }, 2000);
    }

    function speakReply(msgId) {
      const text = rawReplies[msgId] || "";
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
      }
    }

    function downloadReply(msgId) {
      const text = rawReplies[msgId] || "";
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `smk-response-${Date.now()}.txt`;
      a.click();
    }

    function appendUserMessage(text, fileName, scroll = true) {
      heroGreeting.style.display = "none";
      const div = document.createElement("div");
      div.className = "message user";
      if (fileName) {
        div.innerHTML = `<div class="attached-file-badge">📎 ${fileName}</div><div>${text}</div>`;
      } else {
        div.textContent = text;
      }
      messageContainer.appendChild(div);
      if (scroll) chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function createModelMessagePlaceholder(msgId) {
      const div = document.createElement("div");
      div.className = "message model";
      div.id = `msg-${msgId}`;
      div.innerHTML = `
        <div class="role-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
          SMK Chatbot
        </div>
        <div class="content">Thinking...</div>
        <div class="response-actions" style="display:none;" id="actions-${msgId}"></div>
      `;
      messageContainer.appendChild(div);
      chatScroll.scrollTop = chatScroll.scrollHeight;
      return {
        content: div.querySelector(".content"),
        actions: div.querySelector(".response-actions")
      };
    }

    function populateActionButtons(actionsTarget, msgId, promptText) {
      actionsTarget.innerHTML = `
        <button class="action-btn" onclick="copyReply('${msgId}', this)">📋 Copy</button>
        <button class="action-btn" onclick="speakReply('${msgId}')">🔊 Listen</button>
        <button class="action-btn" onclick="downloadReply('${msgId}')">💾 Save</button>
        <button class="action-btn" onclick="handleSend('${promptText.replace(/'/g, "\\'")}')">🔄 Regenerate</button>
      `;
      actionsTarget.style.display = "flex";
    }

    async function executeModelRequest(apiKey, selectedModel, payload) {
      const options = Array.from(modelSelect.options).map(o => o.value);
      const candidates = [selectedModel, ...options].filter((v, i, a) => a.indexOf(v) === i);

      let lastError = null;
      for (const m of candidates) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (response.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            return data.candidates[0].content.parts[0].text;
          }

          if (data.error) {
            lastError = data.error.message;
            if (data.error.code === 404 || data.error.code === 503 || data.error.message.includes("demand") || data.error.message.includes("not found")) {
              continue;
            }
            throw new Error(data.error.message);
          }
        } catch (e) {
          lastError = e.message;
        }
      }
      throw new Error(lastError || "Could not generate content. Please verify your API key and connection.");
    }

    async function handleSend(retryPrompt = null) {
      const text = retryPrompt || promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const model = modelSelect.value;

      if (!apiKey) {
        alert("Please paste your Gemini API key in the sidebar first.");
        return;
      }
      if (!text && !currentAttachment) return;

      if (!currentSessionId || !conversations[currentSessionId]) {
        currentSessionId = "session_" + Date.now();
        conversations[currentSessionId] = { title: text.slice(0, 30) || "Conversation", history: [] };
      }

      const activeSession = conversations[currentSessionId];
      const attached = currentAttachment;
      appendUserMessage(text || "(Sent attachment)", attached ? attached.name : null);

      promptInput.value = "";
      promptInput.style.height = "24px";
      sendBtn.disabled = true;

      const parts = [];
      if (attached) {
        parts.push({
          inlineData: {
            mimeType: attached.mimeType,
            data: attached.data
          }
        });
      }
      if (text) parts.push({ text: text });

      activeSession.history.push({ role: "user", parts: parts });
      if (activeSession.title === "New conversation") {
        activeSession.title = (text || attached.name).slice(0, 28) + "...";
      }
      saveConversationsToStorage();
      renderChatSessions();
      clearAttachedFile();

      const msgId = Date.now();
      const { content: contentTarget, actions: actionsTarget } = createModelMessagePlaceholder(msgId);

      try {
        const replyText = await executeModelRequest(apiKey, model, { contents: activeSession.history });
        rawReplies[msgId] = replyText;

        renderMarkdown(replyText, contentTarget);
        activeSession.history.push({ role: "model", parts: [{ text: replyText }] });
        saveConversationsToStorage();

        populateActionButtons(actionsTarget, msgId, text);
      } catch (err) {
        contentTarget.innerHTML = `<span style="color:#f87171;">${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }
    }

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    loadSavedState();
    if (!currentSessionId) startNewChat();
  </script>
</body>
</html>
